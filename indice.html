<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>GIAE · NORMA-CHILE v1.0</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial, sans-serif;background:#f6f7f9;color:#1d2733;margin:0}
header{background:#142132;color:white;padding:24px}
main{padding:24px;max-width:1200px;margin:auto}
.card{background:white;border:1px solid #d9dee7;border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 1px 2px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2f7;margin:3px;font-size:12px}
h1,h2{margin-top:0}
input,select{padding:10px;border:1px solid #cfd6df;border-radius:8px;width:100%;box-sizing:border-box}
table{width:100%;border-collapse:collapse;background:white}
td,th{padding:10px;border-bottom:1px solid #e6ebf2;text-align:left;font-size:14px}
small{color:#5c6978}
</style>
</head>
<body>
<header>
<h1>NORMA-CHILE v1.0</h1>
<p>Base normativa digital para GIAE · DS N°8 + RIC 1 al 19</p>
</header>
<main>
<section class="card">
<h2>Estado</h2>
<div class="grid">
<div><strong id="docs">0</strong><br><small>Documentos catalogados</small></div>
<div><strong id="rules">0</strong><br><small>Reglas DS8 iniciales</small></div>
<div><strong id="rics">0</strong><br><small>RIC indexados</small></div>
</div>
</section>
<section class="card">
<h2>Buscar regla</h2>
<input id="q" placeholder="Ej: Artículo 7, documentación, SEC, lugar de reunión...">
</section>
<section class="card">
<h2>Reglas base DS N°8</h2>
<table><thead><tr><th>ID</th><th>Categoría</th><th>Nivel</th><th>Mensaje</th><th>Referencia</th></tr></thead><tbody id="tbody"></tbody></table>
</section>
<section class="card">
<h2>Catálogo RIC 1 al 19</h2>
<div id="ricList" class="grid"></div>
</section>
</main>
<script src="core/norma-chile/normaChile.js"></script>
<script>
async function init(){
 const st=await NormaChile.cargar();
 docs.textContent=st.documentos; rules.textContent=st.reglas; rics.textContent=st.ric;
 render(NormaChile.reglas);
 ricList.innerHTML = NormaChile.ricIndex.map(r=>`<div class="card"><b>${r.documento}</b><br><small>${r.materia}</small><br><span class="badge">${r.estado}</span><span class="badge">${r.prioridad}</span></div>`).join('');
}
function render(list){
 tbody.innerHTML=list.map(r=>`<tr><td>${r.id}</td><td>${r.categoria}</td><td>${r.nivel}</td><td>${r.mensaje_usuario}</td><td>${r.referencia}</td></tr>`).join('');
}
q.addEventListener('input',e=>{
 const v=e.target.value.toLowerCase();
 render(NormaChile.reglas.filter(r=>JSON.stringify(r).toLowerCase().includes(v)));
});
init();
</script>
</body>
</html>
