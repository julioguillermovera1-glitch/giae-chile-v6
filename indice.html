<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GIAE Chile v1.0</title>
  <link rel="stylesheet" href="css/platform.css" />
</head>
<body>
  <noscript>GIAE Chile necesita JavaScript habilitado para funcionar.</noscript>

  <section id="loginView" class="login-view">
    <div class="brand-card">
      <p class="eyebrow">Plataforma modular</p>
      <h1>GIAE Chile v1.0</h1>
      <p>Diseño, cálculo, documentación y auditoría de instalaciones eléctricas en Chile.</p>
      <div class="profile-grid" aria-label="Tipos de usuario">
        <button data-profile="independiente">Instalador independiente</button>
        <button data-profile="empresa">Empresa</button>
        <button data-profile="estudiante">Estudiante</button>
      </div>
    </div>
  </section>

  <main id="platformView" class="platform hidden">
    <aside class="sidebar" aria-label="Navegación principal">
      <div class="logo-block">
        <strong>GIAE</strong>
        <span>Chile v1.0</span>
      </div>
      <nav id="moduleMenu"></nav>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow">Espacio de trabajo</p>
          <h2 id="workspaceTitle">Inicio</h2>
        </div>
        <div class="top-actions">
          <span id="activeProfile" class="pill">Sin sesión</span>
          <button id="saveProjectBtn">Guardar</button>
          <button id="exportBtn">Exportar</button>
        </div>
      </header>

      <section id="windowHost" class="window-host"></section>
    </section>
  </main>

  <script type="module" src="core/main.js"></script>
</body>
</html>
