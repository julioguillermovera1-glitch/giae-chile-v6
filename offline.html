<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102033">
  <title>GIAE Chile Offline</title>
  <link rel="icon" href="assets/icons/giae-icon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:light dark;--bg:#eef3f8;--ink:#102033;--muted:#536579;--panel:#ffffff;--line:#d8e3ef;--accent:#10b981}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);padding:24px}
    main{width:min(620px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 18px 45px rgba(16,32,51,.12)}
    img{width:72px;height:72px} h1{margin:18px 0 8px;font-size:clamp(1.8rem,6vw,3rem)} p{color:var(--muted);line-height:1.55} .status{border-left:4px solid var(--accent);background:#effaf5;border-radius:12px;padding:14px;margin-top:18px;font-weight:700}
  </style>
</head>
<body>
  <main>
    <img src="assets/icons/giae-icon.svg" alt="GIAE Chile">
    <h1>GIAE Chile sin conexion</h1>
    <p>La app local puede seguir abriendo la base instalada. Algunas funciones necesitan haber sido cargadas antes o recuperar conexion para actualizar datos.</p>
    <div class="status">Vuelve a conectarte y recarga GIAE para sincronizar la version mas reciente.</div>
  </main>
</body>
</html>
